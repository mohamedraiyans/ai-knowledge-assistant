name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall runs `prisma generate` and the ESM marker script.
      - name: Install
        run: npm ci

      - name: Type-check api
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Type-check web
        working-directory: apps/web
        run: npx next typegen && npx tsc --noEmit

      - name: Unit tests
        working-directory: apps/api
        run: npx jest --ci
